[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canon-sd-import"
version = "1.0.0"
description = "Safely back up Canon SD card photos into one folder per day, with verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
canon-import = "canon_import.cli:import_main"
canon-summary = "canon_import.cli:summary_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["canon_import"]
